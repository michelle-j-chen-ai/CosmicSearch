name = "vlm-embedding-atlas"
enable_filestore = false
enable_gcs_fuse = false
enable_postgres = false
enable_mysql = false
enable_secrets = true
enable_api_gateway = false
enable_slack = false

[cloudrun]
  # The resident atlas is ~250k points: 2MB of coordinates, ~50MB of PCA vectors
  # and ~40MB of metadata strings, plus scratch for the kNN matmul.
  memory = "2Gi"
  # 2 cores: a full-corpus cosine pass over the 250k x 50 PCA matrix is a ~50MB
  # gemv (~10ms), so neighbor lookups are not the constraint; the second core
  # keeps request handling responsive during the startup load.
  cpu = "2"
  timeout = "300s"
  # Keep one instance warm so the artifact download and the density/category
  # precompute are never paid on a user request.
  min_instances = 1
  max_instances = 2
  # NOTE: CPU-always-allocated and startup boost are NOT expressible in this
  # schema but are REQUIRED, and `apps-platform app deploy` resets them. The
  # atlas loads on a background thread, so with request-time throttling (the
  # Cloud Run default) the instance is starved the moment startup returns and
  # the parse never finishes -- the service stays 503 forever with no error.
  # Re-apply after every apps-platform deploy:
  #   gcloud run services update vlm-embedding-atlas --region us-west1 \
  #     --project experimental-apps-v2 --no-cpu-throttling --cpu-boost

[metadata]
  owner = "michelle.chen@applied.co"
  description = "Interactive UMAP atlas of VLM (Cosmos-Embed) video embeddings"
  maintainers = ["michelle.chen@applied.co"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VLM Embedding Atlas</title>
<script src="https://unpkg.com/deck.gl@9.0.16/dist.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: grid;
    grid-template-columns: 232px 1fr 0;
    transition: grid-template-columns 160ms ease;
  }
  body.detail-open { grid-template-columns: 232px 1fr 380px; }

  aside, #detail {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 14px;
  }
  #detail { border-right: none; border-left: 1px solid var(--border); }
  body:not(.detail-open) #detail { display: none; }

  h1 { font-size: 13px; margin: 0 0 2px; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 11px; margin-bottom: 16px; word-break: break-all; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
       color: var(--muted); margin: 18px 0 8px; font-weight: 600; }

  select, button {
    width: 100%; background: #21262d; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--muted); }
  button.active { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 4px; }

  #legend { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
  .legend-row { display: flex; align-items: center; gap: 7px; font-size: 11px;
                color: var(--muted); font-variant-numeric: tabular-nums; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .legend-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #canvas-wrap { position: relative; }
  #deck-canvas { width: 100%; height: 100%; display: block; }
  #lasso-overlay { position: absolute; inset: 0; pointer-events: none; }
  body.lasso #deck-canvas { cursor: crosshair; }

  #tooltip {
    position: absolute; pointer-events: none; z-index: 10;
    background: rgba(13,17,23,.94); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 11px;
    max-width: 300px; display: none; word-break: break-all;
  }
  #status {
    position: absolute; left: 12px; bottom: 10px; font-size: 11px;
    color: var(--muted); background: rgba(13,17,23,.8);
    padding: 3px 8px; border-radius: 5px;
  }

  video { width: 100%; border-radius: 6px; background: #000; margin-bottom: 10px; }
  dl { display: grid; grid-template-columns: 74px 1fr; gap: 3px 8px;
       font-size: 11px; margin: 0 0 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; word-break: break-all; font-variant-numeric: tabular-nums; }
  #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cell { border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
          cursor: pointer; background: #000; }
  .cell:hover { border-color: var(--accent); }
  .cell video { margin: 0; border-radius: 0; }
  .cell .cap { font-size: 10px; color: var(--muted); padding: 3px 5px;
               background: var(--panel); font-variant-numeric: tabular-nums; }
  .close { float: right; width: auto; padding: 2px 8px; }
</style>
</head>
<body>

<aside>
  <h1>VLM Embedding Atlas</h1>
  <div class="sub" id="meta-line">loading…</div>

  <label for="color-field">Color by</label>
  <select id="color-field"></select>
  <div id="legend"></div>

  <h2>Display</h2>
  <label for="point-size">Point size <span id="point-size-val">2.0</span></label>
  <input type="range" id="point-size" min="0.5" max="8" step="0.5" value="2" />
  <label for="opacity">Opacity <span id="opacity-val">0.65</span></label>
  <input type="range" id="opacity" min="0.05" max="1" step="0.05" value="0.65" />

  <h2>Select</h2>
  <button id="lasso-btn">Lasso region</button>
  <label style="margin-top:8px">Drag to enclose points. Neighbors always come
    from exact cosine kNN in PCA space, never from these 2D coordinates.</label>
  <button id="reset-btn" style="margin-top:10px">Reset view</button>
</aside>

<div id="canvas-wrap">
  <canvas id="deck-canvas"></canvas>
  <canvas id="lasso-overlay"></canvas>
  <div id="tooltip"></div>
  <div id="status">loading points…</div>
</div>

<div id="detail"></div>

<script>
// 24 categorical hues, ordered so adjacent legend entries stay distinguishable.
const CATEGORICAL = [
  [88,166,255],[255,138,101],[126,231,135],[255,205,92],[188,140,255],[94,234,212],
  [255,145,180],[168,197,255],[255,183,77],[121,214,168],[214,152,255],[130,220,255],
  [255,167,140],[176,224,120],[255,224,130],[200,170,255],[140,230,220],[255,178,205],
  [150,175,220],[230,190,120],[160,200,175],[190,175,215],[170,205,225],[210,200,180],
];
// Sequential ramp for the density coloring: a categorical palette on an ordered
// quantity reads as noise.
const SEQUENTIAL = [
  [24,42,72],[32,72,110],[36,104,140],[42,138,150],[74,170,140],[142,196,110],
  [212,214,92],[253,231,140],
];

const state = {
  count: 0, positions: null, colorIndices: null, legend: [],
  field: null, selected: null, lasso: false, lassoPath: [],
};

const el = (id) => document.getElementById(id);
const deckCanvas = el('deck-canvas');
const overlay = el('lasso-overlay');

// A plain orthographic view: the coordinates are a unit-box UMAP layout, not
// geography, so there is no projection to apply.
const deckgl = new deck.Deck({
  canvas: deckCanvas,
  views: new deck.OrthographicView({ flipY: false }),
  initialViewState: { target: [0, 0, 0], zoom: 8 },
  controller: { dragPan: true, scrollZoom: { smooth: true } },
  getTooltip: null,
  onHover: onHover,
  onClick: onClick,
  layers: [],
});

function palette() {
  return state.field === 'density' ? SEQUENTIAL : CATEGORICAL;
}

function buildLayer() {
  if (!state.positions) return;
  const colors = palette();
  const rgb = new Uint8Array(state.count * 3);
  for (let i = 0; i < state.count; i++) {
    const c = colors[state.colorIndices[i] % colors.length];
    rgb[i * 3] = c[0]; rgb[i * 3 + 1] = c[1]; rgb[i * 3 + 2] = c[2];
  }
  const size = parseFloat(el('point-size').value);
  const alpha = parseFloat(el('opacity').value);

  const layers = [new deck.ScatterplotLayer({
    id: 'points',
    // Binary attributes: passing 250k plain objects would cost a per-point JS
    // allocation and a slow upload on every redraw.
    data: { length: state.count, attributes: {
      getPosition: { value: state.positions, size: 2 },
      getFillColor: { value: rgb, size: 3, normalized: true },
    }},
    radiusUnits: 'pixels',
    getRadius: size,
    radiusMinPixels: 0.5,
    opacity: alpha,
    pickable: true,
    // Picking needs a wider hit area than the visual radius or small points
    // become impossible to click.
    pickingRadius: 6,
    updateTriggers: { getFillColor: state.field },
  })];

  if (state.selected !== null) {
    const i = state.selected;
    layers.push(new deck.ScatterplotLayer({
      id: 'selected',
      data: [{ position: [state.positions[i * 2], state.positions[i * 2 + 1]] }],
      getPosition: (d) => d.position,
      radiusUnits: 'pixels', getRadius: size + 5,
      filled: false, stroked: true, getLineWidth: 2, lineWidthUnits: 'pixels',
      getLineColor: [255, 255, 255],
    }));
  }
  deckgl.setProps({ layers });
}

function onHover(info) {
  const tip = el('tooltip');
  if (info.index === undefined || info.index < 0 || state.lasso) {
    tip.style.display = 'none';
    return;
  }
  tip.style.display = 'block';
  tip.style.left = (info.x + 12) + 'px';
  tip.style.top = (info.y + 12) + 'px';
  tip.textContent = `#${info.index} · ${state.legend[state.colorIndices[info.index]] ?? ''}`;
}

async function onClick(info) {
  if (state.lasso || info.index === undefined || info.index < 0) return;
  state.selected = info.index;
  buildLayer();
  const [point, nn] = await Promise.all([
    fetch(`/api/atlas/point/${info.index}`).then((r) => r.json()),
    fetch(`/api/atlas/neighbors/${info.index}?k=24`).then((r) => r.json()),
  ]);
  renderDetail(point, nn.neighbors);
}

function renderDetail(point, neighbors) {
  document.body.classList.add('detail-open');
  el('detail').innerHTML = `
    <button class="close" onclick="closeDetail()">close</button>
    <h2 style="margin-top:0">Selected clip</h2>
    <video src="${point.video_url}" controls autoplay muted loop playsinline></video>
    <dl>
      <dt>chunk</dt><dd>${point.chunk_id}</dd>
      <dt>drive</dt><dd>${point.run_uuid}</dd>
      <dt>date</dt><dd>${point.dt}</dd>
      <dt>start</dt><dd>${point.chunk_start_unix}</dd>
    </dl>
    <h2>${neighbors.length} nearest neighbors <span style="text-transform:none;
      letter-spacing:0">(cosine, PCA space)</span></h2>
    <div id="grid">${neighbors.map(cell).join('')}</div>`;
}

function cell(item) {
  const score = item.similarity !== undefined ? item.similarity.toFixed(3) : item.dt;
  return `<div class="cell" onclick="jumpTo(${item.index})">
    <video src="${item.video_url}" muted loop playsinline
           onmouseenter="this.play()" onmouseleave="this.pause()"></video>
    <div class="cap">${score}</div></div>`;
}

function jumpTo(index) {
  onClick({ index });
}

function closeDetail() {
  document.body.classList.remove('detail-open');
  state.selected = null;
  buildLayer();
}

// ---- lasso ------------------------------------------------------------------

function setLasso(on) {
  state.lasso = on;
  document.body.classList.toggle('lasso', on);
  el('lasso-btn').classList.toggle('active', on);
  // Panning and drawing are both drags, so the controller has to yield while
  // the lasso is armed.
  deckgl.setProps({ controller: { dragPan: !on, scrollZoom: { smooth: true } } });
  if (!on) clearOverlay();
}

function clearOverlay() {
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  state.lassoPath = [];
}

deckCanvas.addEventListener('pointerdown', (e) => {
  if (!state.lasso) return;
  state.lassoPath = [[e.offsetX, e.offsetY]];
  overlay.width = deckCanvas.clientWidth;
  overlay.height = deckCanvas.clientHeight;
});

deckCanvas.addEventListener('pointermove', (e) => {
  if (!state.lasso || state.lassoPath.length === 0 || e.buttons === 0) return;
  state.lassoPath.push([e.offsetX, e.offsetY]);
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  ctx.strokeStyle = '#58a6ff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  state.lassoPath.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  ctx.stroke();
});

deckCanvas.addEventListener('pointerup', async () => {
  if (!state.lasso || state.lassoPath.length < 3) return;
  const viewport = deckgl.getViewports()[0];
  // Screen path -> world coordinates, sampled: a freehand drag yields hundreds
  // of vertices and the polygon test is linear in edge count.
  const step = Math.max(1, Math.floor(state.lassoPath.length / 64));
  const polygon = state.lassoPath
    .filter((_, i) => i % step === 0)
    .map(([x, y]) => viewport.unproject([x, y]).slice(0, 2));
  setLasso(false);
  el('status').textContent = 'selecting…';
  const res = await fetch('/api/atlas/lasso', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ polygon, limit: 48 }),
  }).then((r) => r.json());
  el('status').textContent = `${state.count.toLocaleString()} points`;
  document.body.classList.add('detail-open');
  el('detail').innerHTML = `
    <button class="close" onclick="closeDetail()">close</button>
    <h2 style="margin-top:0">Region sample</h2>
    <div class="sub">${res.count} clips nearest the selection centroid.
      Hover a tile to play it.</div>
    <div id="grid">${res.items.map(cell).join('')}</div>`;
});

// ---- data loading -----------------------------------------------------------

async function loadColoring(field) {
  const [buf, legend] = await Promise.all([
    fetch(`/api/atlas/coloring/${field}`).then((r) => r.arrayBuffer()),
    fetch(`/api/atlas/legend/${field}`).then((r) => r.json()),
  ]);
  state.colorIndices = new Uint8Array(buf);
  state.legend = legend.legend;
  state.field = field;
  el('legend').innerHTML = state.legend.map((label, i) => {
    const c = palette()[i % palette().length];
    return `<div class="legend-row">
      <div class="swatch" style="background:rgb(${c})"></div>
      <span title="${label}">${label}</span></div>`;
  }).join('');
  buildLayer();
}

async function init() {
  // The atlas loads on a background thread, so /api/atlas/meta answers 503 until it
  // is resident. Poll rather than failing the page on a cold instance.
  let meta = null;
  while (!meta) {
    const res = await fetch('/api/atlas/meta');
    if (res.ok) { meta = await res.json(); break; }
    const health = await fetch('/healthz').then((r) => r.json()).catch(() => ({}));
    el('status').textContent = health.error
      ? `atlas unavailable: ${health.error}`
      : 'loading atlas…';
    await new Promise((r) => setTimeout(r, 3000));
  }
  state.count = meta.count;
  el('meta-line').textContent =
    `${meta.count.toLocaleString()} clips · PCA ${meta.pca_dim}d · rev ${meta.revision}`;

  const select = el('color-field');
  select.innerHTML = meta.color_fields
    .map((f) => `<option value="${f}">${f}</option>`).join('');
  select.onchange = () => loadColoring(select.value);

  const buf = await fetch('/api/atlas/points').then((r) => r.arrayBuffer());
  state.positions = new Float32Array(buf);
  el('status').textContent = `${state.count.toLocaleString()} points`;

  const initial = meta.color_fields.includes('density') ? 'density' : meta.color_fields[0];
  select.value = initial;
  await loadColoring(initial);
}

for (const id of ['point-size', 'opacity']) {
  el(id).addEventListener('input', (e) => {
    el(id + '-val').textContent = parseFloat(e.target.value).toFixed(2);
    buildLayer();
  });
}
el('lasso-btn').onclick = () => setLasso(!state.lasso);
el('reset-btn').onclick = () =>
  deckgl.setProps({ initialViewState: { target: [0, 0, 0], zoom: 8, transitionDuration: 300 } });

init();
</script>
</body>
</html>

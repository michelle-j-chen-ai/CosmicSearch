# Deploy config for the frontier service `vlm-nls-search-trucking`
# (https://vlm-nls-search-trucking.experimental.apps.applied.dev).
#
# Same image as `vlm-nls-search` (project.toml), same code, same endpoints. The
# only difference is NLS_PROJECTS=frontier, which selects the frontier Lance
# table, clip prefix and Data Explorer cluster from deployment.py, and makes
# frontier the project a request that names none is served from.
#
#   apps-platform app deploy -c project-trucking.toml
#
# Two services rather than one serving both projects, for memory: each resident
# int8 corpus is >13GB against a 32Gi ceiling, and one process cannot hold both
# alongside the ~5GB encoder. Splitting also gives each fleet its own Postgres
# schema -- db.py derives it from K_SERVICE -- so tags, marks and exports for
# frontier live in vlm_nls_search_trucking and never mix with neuron's.
#
# Data Explorer for THIS service is the FRONTIER Dora (grpc.frontier.prod.applied.dev,
# NOT .oci.applied.dev like neuron), where the trucking tag-based segment sets are
# synced by onroad/tools/offboard/frontier/workflows/frontier_dora_segment_set_sync_workflow.py.
# deployment.py holds that hostname, so only the machine credentials need mounting,
# and they must be FRONTIER-scoped (the neuron machine client is not valid there):
#   gcloud run services update vlm-nls-search-trucking --region=us-west1 \
#     --project=experimental-apps-v2 --update-secrets \
#     MACHINE_CLIENT_ID=<frontier-machine-client-id-secret>:latest,\
#     MACHINE_CLIENT_SECRET=<frontier-machine-client-secret-secret>:latest
# The existing frontier creds trucking-ops-dashboard-adp-machine-auth-client-id/
# -secret can be reused, but the trucking SA
# (vlm-nls-search-trucking-sa@experimental-apps-v2.iam.gserviceaccount.com) must
# first be granted roles/secretmanager.secretAccessor on them, e.g.:
#   gcloud secrets add-iam-policy-binding trucking-ops-dashboard-adp-machine-auth-client-id \
#     --member=serviceAccount:vlm-nls-search-trucking-sa@experimental-apps-v2.iam.gserviceaccount.com \
#     --role=roles/secretmanager.secretAccessor --project=experimental-apps-v2
#   (repeat for ...-client-secret). Alternatively copy the two values into this
#   app's own namespace (apps-platform app secret set MACHINE_CLIENT_ID <val>
#   --service vlm-nls-search-trucking) so its SA can read them directly.
#
# Also required, as env or app secrets: NLS_PROJECTS=frontier, the AWS_* OCI
# credentials, and NLS_MODEL_ARTIFACT_URI -- the SAME fine-tuned artifact as
# neuron, because both corpora are embedded by it and a query scored against
# another model's embeddings returns a confident ranked list with nothing to
# signal it.
name = "vlm-nls-search-trucking"
# Same audience as the neuron service: the browser path is IAP, and both fleets
# are read by the same people.
allowed_usergroups = [
  "okta-team-applied-fte@applied.co",
  "apps-platform-contractor-deployers@applied.co",
]
enable_filestore = false
# GCS-fuse mount backs the Lance + model download cache (NLS_CACHE_ROOT), so the
# corpus is downloaded once and shared across instances, not re-paid per cold start.
enable_gcs_fuse = true
# Cloud SQL holds this service's own catalog: tags, marks and exports for frontier.
enable_postgres = true
enable_mysql = false
enable_secrets = true
# The same programmatic entry point neuron has. Keys are per-app, so a frontier
# integration holds a frontier key and cannot read neuron's tags.
enable_api_gateway = true
api_gateway_paths = ["/api/v1/{path=**}"]
enable_slack = false

[cloudrun]
  # Sized like the neuron service: the resident int8/PCA corpus plus the ~5GB
  # fp32 encoder. 8 vCPU is what Cloud Run requires for 32GiB, and the encoder
  # load is CPU-bound, so the cores also shorten the warmup window.
  memory = "32Gi"
  cpu = "8"
  # Query latency is ~100ms, but the cold-start model+corpus load is minutes.
  timeout = "600s"
  # Keep TWO instances warm. Cloud Run periodically recycles min-instances for
  # infra maintenance (~daily, reason MANUAL_OR_CUSTOMER_MIN_INSTANCE) and there is
  # no knob to disable it; with a single min-instance that recycle forces the full
  # model+corpus reload and 503s in the meantime. Two instances let the rolling
  # (one-at-a-time) recycle stay invisible: the other instance keeps serving with
  # the model resident while the replacement warms in the background.
  min_instances = 2
  # >= min+1 so a rolling replacement has a slot without evicting a warm instance.
  max_instances = 3

[metadata]
  owner = "sibo.geng@applied.co"
  # Platform-level maintainers: granted deploy/manage (develop) access to the
  # app, in addition to the owner. Distinct from NLS_OWNER_EMAIL, which only
  # gates the in-app usage-analytics view.
  maintainers = ["michelle.chen@applied.co"]
  description = "Natural-language similarity search over VLM (Cosmos-Embed) video embeddings -- frontier corpus"

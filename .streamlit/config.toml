# Refined dark "signal-room" theme for the VLM search tool. Color identity lives
# here (robust across Streamlit versions); typography + component polish are
# injected as CSS from app.py so they ship in the app.py layer too.
[theme]
base = "dark"
primaryColor = "#c8ff4d"            # electric lime -- the single accent / "signal"
backgroundColor = "#0d0f13"         # near-black canvas
secondaryBackgroundColor = "#171a21"  # sidebar / cards
textColor = "#e8eaf0"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
